  /* Liebherr UI colours (brand.liebherr.com/colours, March 2026) */
  :root {
    --yellow: #FFD000;
    --black: #000000;
    --white: #FFFFFF;
    --bar: #FFFFFF;
    --bg: #FFFFFF;
    --surface: #f0f3f6;   /* Steel-100 */
    --surface-hover: #e5e8ed;
    --text: #000000;
    --muted: #9ea4ab;     /* Steel-500, section label */
    --note: #6b7278;      /* Steel-700 */
    --head: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Helvetica Neue", Arial, system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bar: #202326; --bg: #202326; --surface: #282c30; --surface-hover: #353a40;
      --text: #FFFFFF; --muted: #888e94; --note: #bdc4ca;
    }
    :root:not([data-theme="light"]) .logo { filter: invert(1); }
  }
  :root[data-theme="dark"] {
    --bar: #202326; --bg: #202326; --surface: #282c30; --surface-hover: #353a40;
    --text: #FFFFFF; --muted: #888e94; --note: #bdc4ca;
  }
  :root[data-theme="dark"] .logo { filter: invert(1); }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--body);
    display: flex; flex-direction: column;
  }
  .wrap { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 2.5rem); }

  /* Top bar: logo + section name */
  .topbar { background: var(--bar); }
  .topbar .wrap { display: flex; align-items: flex-end; gap: 1.25rem; padding-top: 1.1rem; padding-bottom: 1.1rem; }
  .logo { display: block; height: clamp(22px, 3.4vw, 30px); width: auto; }
  .section { color: var(--muted); font-size: 1.1rem; line-height: 1; padding-bottom: 1px; }

  /* Yellow hero */
  .hero { background: var(--yellow); color: var(--black); }
  .hero .wrap { padding-top: clamp(2rem, 5vw, 3.25rem); padding-bottom: clamp(2rem, 5vw, 3rem); }
  .hero h1 {
    font-family: var(--head); font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.02; margin: 0;
  }
  .rule { width: 68px; height: 4px; background: var(--black); margin: 1.1rem 0 0; border: 0; }

  /* App tiles — fluid sizing for phones and tablets */
  main { flex: 1; display: flex; }
  main .wrap { flex: 1; display: flex; flex-direction: column;
    padding-top: var(--gap); padding-bottom: var(--gap); }
  :root { --gap: clamp(.75rem, 2.2vmin, 1.5rem); --cols: 2; }
  .grid {
    flex: 1; display: flex; flex-wrap: wrap; justify-content: center;
    align-content: flex-start; gap: var(--gap);
  }
  .tile {
    flex: 0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(.6rem, 1.8vmin, 1.1rem); text-align: center;
    min-height: clamp(130px, 24vmin, 280px); padding: clamp(1rem, 3vmin, 2rem) .75rem;
    background: var(--surface); color: var(--text);
    text-decoration: none; font: inherit; cursor: pointer;
    border-bottom: 5px solid var(--yellow);
    transition: background-color .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:hover, .tile:active { background: var(--surface-hover); }
  .tile:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .icon {
    flex: none; width: clamp(60px, 12vmin, 132px); height: clamp(60px, 12vmin, 132px);
    display: grid; place-items: center; font-size: 2.2rem;
    background: var(--yellow); color: var(--black);
  }
  .icon img { width: 70%; height: 70%; object-fit: contain; display: block; }
  .name { display: block; font-family: var(--head); font-weight: 700;
    font-size: clamp(1.05rem, calc(.55rem + 2.4vmin), 2rem); line-height: 1.1; }

  footer { color: var(--note); font-size: .8rem; }
  footer .wrap { padding-bottom: 1rem; }

  /* Portrait (phones and tablets): tiles grow to fill the screen */
  @media (orientation: portrait) {
    .grid { align-content: stretch; }
  }
  @media (min-width: 600px) and (orientation: portrait) {
    .wrap { max-width: 1000px; }
    .tile { min-height: 0; }
  }

  /* Tablets / wide screens in landscape: three across */
  @media (min-width: 900px) and (orientation: landscape) {
    :root { --cols: 3; }
    .wrap { max-width: 1240px; }
    .grid { align-content: stretch; }
    .tile { min-height: clamp(130px, 24vh, 300px); }
    .hero .wrap { padding-top: clamp(1.5rem, 4vh, 3rem); padding-bottom: clamp(1.5rem, 4vh, 3rem); }
  }

  /* Short landscape screens (phones on their side): compact hero, three across */
  @media (orientation: landscape) and (max-height: 560px) {
    :root { --cols: 3; }
    .hero .wrap { padding-top: 1rem; padding-bottom: 1rem; }
    .hero h1 { font-size: 2rem; }
    .rule { margin: .6rem 0 0; }
    .tile { min-height: 110px; padding: .8rem .5rem; }
    .icon { width: 52px; height: 52px; }
  }

  /* Small phones */
  @media (max-width: 420px) {
    .topbar .wrap { gap: .9rem; }
    .hero h1 { font-size: 2.4rem; }
  }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
